openapi: 3.0.3
info:
  title: ms-andesstay-audit
  description: >
    Timeline de auditoria de las reservas. Solo lectura: el historial se construye
    consumiendo el topico Kafka audit.timeline, nunca por escritura directa.
    Responde quien hizo que, cuando y entre que estados.


    La version va UNA sola vez en la ruta. Durante un tiempo el controlador repitio
    el prefijo y servia /api/v1/audit/v1/events, de modo que el frontend y el
    gateway recibian 404 en las rutas correctas; esta especificacion describe las
    rutas reales desde que eso se corrigio.
  version: 1.1.0

servers:
  - url: http://localhost:8084
    description: Desarrollo local
  - url: http://ec2-apps:8084
    description: Despliegue en EC2 (red interna)

security:
  - bearerAuth: []

tags:
  - name: auditoria

paths:
  /api/v1/audit/reservations/{id}/timeline:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numerico de la reserva
        schema: { type: integer, format: int64 }
        example: 123
    get:
      tags: [auditoria]
      summary: Timeline completo de una reserva
      description: >
        Devuelve todos los eventos de la reserva en orden cronologico ascendente.
        El orden esta garantizado porque Kafka particiona por reservationId: todos
        los eventos de una reserva caen en la misma particion y se consumen en orden.


        Solo Admin y Auditor. Una reserva sin eventos devuelve una lista vacia, no 404.
      operationId: timelineDeReserva
      responses:
        '200':
          description: Eventos de la reserva, del mas antiguo al mas reciente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoAuditoria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

  /api/v1/audit/events:
    get:
      tags: [auditoria]
      summary: Eventos en un rango de fechas
      description: >
        Los dos parametros son obligatorios. Solo Admin y Auditor.
      operationId: eventosPorRango
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
          example: '2026-11-01T00:00:00'
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
          example: '2026-11-30T23:59:59'
      responses:
        '200':
          description: Eventos del rango, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoAuditoria' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

  /api/v1/audit/events/actor/{actorId}:
    parameters:
      - name: actorId
        in: path
        required: true
        description: sub del token de quien ejecuto la accion
        schema: { type: string }
    get:
      tags: [auditoria]
      summary: Todas las acciones de un usuario
      description: Solo Admin y Auditor.
      operationId: eventosPorActor
      responses:
        '200':
          description: Eventos de ese usuario, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoAuditoria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

  /api/v1/audit/events/type/{eventType}:
    parameters:
      - name: eventType
        in: path
        required: true
        description: >
          Tipo de evento tal como lo define el contrato de Kafka. Es el nombre del
          contrato y no el del enum del dominio: reservation.in_stay, no EN_ESTADIA.
        schema:
          type: string
          enum:
            - reservation.created
            - reservation.confirmed
            - reservation.checkin_pending
            - reservation.in_stay
            - reservation.checked_out
            - reservation.cancelled
        example: reservation.confirmed
    get:
      tags: [auditoria]
      summary: Eventos de un tipo
      description: Solo Admin y Auditor.
      operationId: eventosPorTipo
      responses:
        '200':
          description: Eventos de ese tipo, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EventoAuditoria' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Solo tokens del tenant corporativo, con rol Admin o Auditor.

  schemas:
    EventoAuditoria:
      type: object
      description: >
        Un hecho del timeline, ya persistido. No es el envelope tal cual: el sobre que
        viaja por audit.timeline se aplana al guardarlo, conservando eventId, traceId,
        el actor y los dos estados de la transicion. El envelope completo esta en
        docs/contracts/events/kafka.md.
      properties:
        id: { type: integer, format: int64 }
        eventId:
          type: string
          format: uuid
          description: Identificador del evento de origen. Es la clave de idempotencia.
        eventType:
          type: string
          example: reservation.confirmed
        reservationId: { type: integer, format: int64, example: 123 }
        unitId: { type: integer, format: int64, example: 45 }
        guestId:
          type: string
          nullable: true
          description: sub del huesped, o null si reservo recepcion a su nombre
        statusBefore:
          type: string
          nullable: true
          description: Estado del que venia la reserva. Null en la creacion.
          example: CREADA
        statusAfter:
          type: string
          description: Estado en el que quedo
          example: CONFIRMADA
        actorId:
          type: string
          description: sub del token de quien ejecuto la accion
        actorRole:
          type: string
          enum: [Admin, Operador, Cliente, Auditor]
        traceId:
          type: string
          format: uuid
          description: Identifica la peticion HTTP que origino el evento
        occurredAt:
          type: string
          format: date-time
          description: >
            Cuando ocurrio el hecho, tomado del envelope. No es cuando se consumio:
            releer el topico desde el principio no cambia esta fecha.
        persistedAt:
          type: string
          format: date-time
          description: Cuando este servicio lo guardo

    Error:
      type: object
      required: [error, timestamp]
      properties:
        error:
          type: string
          enum:
            - SOLICITUD_INVALIDA
            - TOKEN_INVALIDO
            - ROL_INSUFICIENTE
        mensaje: { type: string }
        timestamp: { type: string, format: date-time }
        traceId: { type: string, format: uuid }

  responses:
    SolicitudInvalida:
      description: Faltan los parametros de fecha o tienen un formato invalido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Falta el token, o es invalido, expirado o de un emisor desconocido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RolInsuficiente:
      description: Token valido pero sin rol Admin ni Auditor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
