openapi: 3.0.3
info:
  title: ms-andesstay-report
  description: >
    Panel de operaciones en tiempo real. Solo lectura: las agregaciones se construyen
    consumiendo el topico Kafka reservations.events, sin bloquear ni acoplar al
    servicio de reservas.
  version: 1.1.0

servers:
  - url: http://localhost:8083
    description: Desarrollo local
  - url: http://ec2-apps:8083
    description: Despliegue en EC2 (red interna)

security:
  - bearerAuth: []

tags:
  - name: kpis

paths:
  /api/v1/report/kpis:
    get:
      tags: [kpis]
      summary: KPIs de operacion
      description: >
        Reservas por hora, tiempo de ciclo y ocupacion activa. Solo Admin.
      operationId: obtenerKpis
      parameters:
        - name: range
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Rango' }
        - name: hostalId
          in: query
          description: Filtra a un hostal en particular
          schema: { type: string }
      responses:
        '200':
          description: KPIs del rango
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kpis' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

  /api/v1/report/kpis/live:
    get:
      tags: [kpis]
      summary: Los mismos KPIs, leidos del estado de Kafka Streams
      description: >
        Devuelve ocupacion activa, tiempo de ciclo medio y reservas por hora, pero
        leidos del almacen que la topologia de Kafka Streams mantiene al dia en vez
        de consultados a MySQL.


        La diferencia no es cosmetica. /kpis recorre el historico en cada llamada y
        su coste crece con los datos; esto lee un valor ya calculado y responde igual
        de rapido con un evento o con un millon, asi que el panel puede refrescarse
        solo. Ademas incluye el tiempo de ciclo, que se mide restando los instantes
        reales de reservation.created y del evento de cierre de cada reserva.


        Si la topologia no esta corriendo —porque el servicio se desplego sin
        clúster— responde disponible=false en lugar de ceros, que serian
        indistinguibles de "no ha pasado nada". Solo Admin.
      operationId: obtenerKpisEnVivo
      parameters:
        - name: range
          in: query
          schema: { $ref: '#/components/schemas/Rango' }
      responses:
        '200':
          description: KPIs en vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpisEnVivo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

  /api/v1/report/top-units:
    get:
      tags: [kpis]
      summary: Unidades mas demandadas
      description: Ranking por numero de reservas en el rango. Solo Admin.
      operationId: obtenerTopUnidades
      parameters:
        - name: range
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Rango' }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Ranking de unidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  range: { $ref: '#/components/schemas/Rango' }
                  generadoEn: { type: string, format: date-time }
                  unidades:
                    type: array
                    items: { $ref: '#/components/schemas/UnidadDemandada' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/RolInsuficiente' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Solo tokens del tenant corporativo, con rol Admin.

  schemas:
    KpisEnVivo:
      type: object
      properties:
        range: { type: string, example: last24h }
        fuente:
          type: string
          enum: [kafka-streams]
          description: De donde salen estos numeros, para distinguirlos de los de /kpis
        disponible:
          type: boolean
          description: Si la topologia de Kafka Streams esta corriendo
        detalle:
          type: string
          description: Presente solo cuando disponible es false
        reservasConocidas:
          type: integer
          description: Cuantas reservas hay en el almacen de estado
        activeReservations:
          type: integer
          description: Reservas en estadia ahora mismo
        tiempoDeCicloMedioMinutos:
          type: integer
          nullable: true
          description: >
            Media en minutos de lo que duraron las reservas ya cerradas, de la
            creacion al checkout o a la cancelacion. Null si todavia no hay ninguna
            cerrada, que es distinto de cero.
        reservationsPerHour:
          type: array
          items:
            type: object
            properties:
              hour: { type: string, example: '2026-11-17 14' }
              total: { type: integer }

    Rango:
      type: string
      enum: [last24h, last7d, last30d]

    Kpis:
      type: object
      properties:
        range: { $ref: '#/components/schemas/Rango' }
        generadoEn: { type: string, format: date-time }
        reservasPorHora:
          type: array
          description: Serie temporal para el grafico del panel
          items:
            type: object
            properties:
              hora: { type: string, format: date-time }
              creadas: { type: integer }
              confirmadas: { type: integer }
              canceladas: { type: integer }
        tiempoCiclo:
          type: object
          description: Horas entre CREADA y CHECKOUT
          properties:
            promedioHoras: { type: number, format: double }
            medianaHoras: { type: number, format: double }
            p95Horas: { type: number, format: double }
            muestras: { type: integer }
        ocupacionActiva:
          type: object
          description: Situacion en este momento, no del rango
          properties:
            unidadesEnEstadia: { type: integer }
            unidadesTotales: { type: integer }
            porcentajeOcupacion: { type: number, format: double }
        totales:
          type: object
          properties:
            reservasCreadas: { type: integer }
            reservasConfirmadas: { type: integer }
            reservasCanceladas: { type: integer }
            tasaCancelacion: { type: number, format: double }

    UnidadDemandada:
      type: object
      properties:
        unitId: { type: string, example: U-045 }
        nombre: { type: string, example: Cabana Coigue }
        tipo:
          type: string
          enum: [HABITACION, CABANA, LODGE]
        reservas: { type: integer }
        nochesVendidas: { type: integer }
        ingresoTotal:
          type: integer
          description: Monto en pesos, sin decimales

    Error:
      type: object
      required: [error, timestamp]
      properties:
        error:
          type: string
          enum:
            - SOLICITUD_INVALIDA
            - RANGO_INVALIDO
            - TOKEN_INVALIDO
            - ROL_INSUFICIENTE
        mensaje: { type: string }
        timestamp: { type: string, format: date-time }
        traceId: { type: string, format: uuid }

  responses:
    SolicitudInvalida:
      description: Parametros invalidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Falta el token, o es invalido, expirado o de un emisor desconocido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RolInsuficiente:
      description: Token valido pero sin rol Admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
