# RabbitMQ configuration - AndesStay
#
# Ya NO se usa management.load_definitions, y el motivo es importante.
#
# Cuando un nodo arranca con definiciones por cargar, RabbitMQ renuncia a crear el usuario y el
# vhost por omisión. Lo dice en su propio log: "Will not seed default virtual host and user: have
# definitions to load". El archivo de definiciones tendría entonces que declarar el usuario, y
# para eso hace falta su password_hash, es decir, versionar un secreto.
#
# Como la topología pasó a declararse en código (ver RabbitMQConfig de ms-andesstay-notify), lo
# único que quedaba en el archivo era el vhost, que RABBITMQ_DEFAULT_VHOST ya crea, y la política
# de alta disponibilidad, que el servicio rabbitmq-init del compose aplica por la API de gestión.
# Sin el archivo, el usuario de RABBITMQ_DEFAULT_USER y RABBITMQ_DEFAULT_PASS se crea con
# permisos completos sobre su vhost, que es lo que los servicios necesitan.

default_vhost = andesstay

# El usuario guest no puede entrar ni desde loopback: los servicios usan el suyo.
loopback_users.guest = false

# Descubrimiento del clúster por configuración estática. Es suficiente y no necesita el
# stop_app / join_cluster / start_app manual que tenía antes el compose, que duplicaba este
# mecanismo y dependía de un sleep fijo.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
