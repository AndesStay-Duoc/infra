# ─────────────────────────────────────────────────────────────────────────────
# AndesStay — RabbitMQ, el consumidor de notificaciones y la API de administración
#
# Clúster de 2 nodos, como pide el caso, más ms-andesstay-notify y ms-andesstay-mq.
#
# Para probar el flujo completo, con reservations, catalog, MySQL y un SMTP de prueba, se suma
# el overlay compose.e2e.yml. Ver docs/prueba-e2e-rabbitmq.md.
# En la nube este compose corre en la instancia ec2-mq (t3.small, 2 GB).
#
# POR QUÉ t3.small Y NO t3.micro. Con cuatro contenedores no cabe en 1 GB: los dos nodos del
# broker y notify ya comprometían 920 MB, y ms-andesstay-mq es el cuarto. Bajar los techos
# para que entrase dejaría al broker sin margen y la demo evaluada corriendo sobre el swap,
# con el OOM killer como riesgo en el peor momento posible. Reparto actual, 1.472 MB de
# 2.048. Con el buzón de correo de prueba son 1.536, y quedan ~500 MB al sistema y a Docker,
# más el swapfile de 2 GB de provision.sh.
#
# Uso en local, solo el broker:
#   docker compose --env-file .env -f infra/mq/compose.yml up -d rabbitmq1 rabbitmq2 rabbitmq-init
#
# Uso completo (construye las imágenes de notify y de mq, que es lo que no cabía en una
# t3.micro: un mvn package de Spring Boot supera el gigabyte de pico. En la t3.small de hoy
# tampoco conviene construir dos a la vez, de ahí que crear-infra.sh lo haga de uno en uno;
# con la fase 2 del plan de CI/CD esto pasa a ser un docker compose pull):
#   docker compose --env-file .env -f infra/mq/compose.yml up -d
#
# Puertos: AMQP 5672 (nodo 1), 5673 (nodo 2).
# La Management UI se publica SOLO en loopback: un puerto publicado por Docker omite ufw,
# porque la regla entra por la cadena DOCKER-USER, así que la única protección real sería
# el Security Group. Con el bind a 127.0.0.1 el túnel SSH es la vía única:
#   ssh -i ~/.ssh/andesstay-key.pem -L 15672:localhost:15672 ubuntu@<ip-de-ec2-mq>
#
# La topología (3 exchanges, 6 colas, 9 bindings) NO está aquí ni en un archivo de
# definiciones: la declara ms-andesstay-notify con @Bean. Ver su RabbitMQConfig y
# infra/docs/validacion/rabbitmq.md.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  andesstay-mq:
    driver: bridge

volumes:
  rabbitmq1-data:
  rabbitmq2-data:

x-rabbit-env: &rabbit-env
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
  RABBITMQ_DEFAULT_VHOST: andesstay

# El ping solo comprueba el nodo Erlang y da healthy ANTES de que la API de gestión escuche
# en el 15672. Por eso se comprueban las dos cosas: rabbitmq-init llama a esa API y, con el
# ping a secas, se encontraba el puerto cerrado.
#
# start_period de 240 s, no 40 s: en el PRIMER arranque, con el volumen vacío, rabbitmq1 pasa unos
# tres minutos intentando descubrir a rabbitmq2 (classic_config los declara a los dos) antes de
# arrancar solo. Pero rabbitmq2 no se crea hasta que rabbitmq1 está healthy, así que esa espera
# siempre se cumple entera. Con 40 s + 10 reintentos de 15 s, compose lo declaraba unhealthy
# segundos antes de que terminara de arrancar y todo lo que depende de él fallaba. Verificado el
# 2026-10-11: "could not discover and join another node; proceeding as a standalone node" a los
# 3 min 4 s. En los arranques siguientes el nodo ya no es virgen y no hay espera.
#
# Desde que rabbitmq2 depende de rabbitmq1 con service_started (ver rabbitmq2), los dos arrancan a
# la vez y esa espera de tres minutos ya no debería ocurrir. El margen se mantiene como red de
# seguridad: un start_period largo solo retrasa cuándo cuentan los fallos, no el arranque.
x-rabbit-health: &rabbit-health
  test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
  interval: 15s
  timeout: 15s
  retries: 10
  start_period: 240s

services:

  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: andesstay-rabbitmq1
    restart: unless-stopped
    environment: *rabbit-env
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - andesstay-mq
    # Los cuatro contenedores necesitan techo explícito, o el OOM killer elige por su
    # cuenta cuál muere. El reparto está en el encabezado del archivo: 1.472 MB de los
    # 2.048 de la t3.small, más el swapfile de 2 GB que crea provision.sh.
    mem_limit: 384m
    healthcheck: *rabbit-health

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: andesstay-rabbitmq2
    restart: unless-stopped
    environment: *rabbit-env
    ports:
      - "5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    # service_started y NO service_healthy, que es lo que habia y lo que impedia
    # reiniciar el cluster.
    #
    # Al arrancar de nuevo, rabbitmq1 lee su estado de cluster del volumen, ve a
    # rabbit@rabbitmq2 como par y espera sus tablas Mnesia antes de darse por
    # arrancado. Si rabbitmq2 no puede arrancar hasta que rabbitmq1 este sano, los
    # dos se esperan: rabbitmq1 agota sus reintentos de Mnesia y el arranque muere.
    #
    # La puerta sana solo funciona la PRIMERA vez, con los volumenes vacios, porque
    # entonces rabbitmq1 arranca en solitario al no tener pares registrados. Falla en
    # todo arranque posterior, que es exactamente el caso del laboratorio: las
    # instancias se detienen al terminar la sesion y hay que levantarlo todo de nuevo.
    #
    # Con service_started los dos nodos arrancan a la vez y se descubren por la
    # configuracion clasica de rabbitmq.conf, que es para lo que existen sus reintentos.
    depends_on:
      rabbitmq1:
        condition: service_started
    networks:
      - andesstay-mq
    mem_limit: 384m
    healthcheck: *rabbit-health
    # Ya NO se sobrescribe el command con stop_app / join_cluster / start_app.
    #
    # Ese bloque duplicaba el cluster_formation.classic_config que rabbitmq.conf ya declara,
    # dependía de un "sleep 15" fijo que en una instancia burstable es una carrera, y al
    # reemplazar el entrypoint por "rabbitmq-server & … & tail -f /dev/null" rompía el manejo
    # de señales. El descubrimiento por classic_config hace el join solo, en el primer
    # arranque de un nodo en blanco.

  # Aplica la política de alta disponibilidad por la API de gestión, una sola vez.
  #
  # No puede ir en un archivo de definiciones: cargar definiciones hace que RabbitMQ renuncie
  # a crear el usuario y el vhost por omisión, y lo dice en su log con todas las letras ("Will
  # not seed default virtual host and user: have definitions to load"). Declarar el usuario en
  # ese archivo exigiría versionar su password_hash. Con la política por API, el usuario lo
  # sigue creando RABBITMQ_DEFAULT_USER y no hay ningún secreto en git.
  #
  # El PUT es idempotente, así que repetirlo en cada "up" no molesta.
  rabbitmq-init:
    image: curlimages/curl:8.11.1
    container_name: andesstay-rabbitmq-init
    restart: "no"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - andesstay-mq
    # Los reintentos son necesarios aunque el healthcheck ya compruebe el puerto: el nodo
    # acepta conexiones unos instantes antes de servir /api.
    command:
      - "--fail"
      - "--silent"
      - "--show-error"
      - "--retry"
      - "15"
      - "--retry-delay"
      - "2"
      - "--retry-connrefused"
      - "--retry-all-errors"
      - "-u"
      - "${RABBITMQ_USER}:${RABBITMQ_PASSWORD}"
      - "-X"
      - "PUT"
      - "http://rabbitmq1:15672/api/policies/andesstay/ha-colas-cmd"
      - "-H"
      - "content-type: application/json"
      # Sin esta política, cada cola clásica vive en un solo nodo y desaparece del servicio si
      # ese nodo cae, que es justo lo que el clúster de dos nodos pretendía evitar.
      #
      # El espejado de colas clásicas está deprecado desde la 3.13 y eliminado en la serie 4.x.
      # La alternativa moderna son las colas quorum, pero con DOS nodos no aportan nada:
      # necesitan mayoría, y la mayoría de dos es dos, así que perder un nodo deja la cola
      # igual de indisponible. Con el clúster de dos nodos que pide el caso, el espejado
      # clásico es la única opción que da tolerancia real a la caída de un nodo.
      - "-d"
      - '{"pattern":"^q\\.cmd\\.","apply-to":"queues","priority":0,"definition":{"ha-mode":"all","ha-sync-mode":"automatic"}}'

  # Buzon de correo de prueba. Recibe SMTP en el 1025 y lo muestra en una bandeja
  # web en el 8025; no reenvia nada a internet.
  #
  # POR QUE ESTA AQUI Y NO ES OPCIONAL. Sin un servidor de correo alcanzable,
  # TODOS los mensajes de q.cmd.email fallan con MailConnectException, agotan sus
  # cuatro intentos y acaban en la DLQ. El flujo de reintentos se veria, pero el
  # camino de exito no existiria, y con el no se puede demostrar ni la
  # idempotencia ni la recuperacion. Con mailpit los dos caminos son observables,
  # y para provocar el fallo basta apuntar MAIL_PORT a un puerto cerrado.
  #
  # Pesa unos 30 MB: es un binario de Go sin dependencias.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: andesstay-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Solo en loopback, como la Management UI y por el mismo motivo: un puerto
      # publicado por Docker omite ufw. La bandeja se mira por tunel SSH:
      #   ssh -i <clave> -L 8025:localhost:8025 ubuntu@<ip-de-ec2-mq>
      - "127.0.0.1:8025:8025"
    networks:
      - andesstay-mq
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/readyz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  notify:
    build:
      context: ../../ms-andesstay-notify
    container_name: andesstay-notify
    restart: unless-stopped
    environment:
      # SerialGC y Xss bajos: la JVM tiene que convivir con los dos nodos del broker.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: andesstay
      RABBITMQ_USER: ${RABBITMQ_USER}
      # El .env usa RABBITMQ_PASSWORD y la aplicación lee RABBITMQ_PASS: el mapeo va aquí.
      # Cambiar uno sin el otro deja la contraseña vacía y el broker responde ACCESS_REFUSED.
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      # Escalera de reintentos. TRES esperas significan CUATRO intentos. Sin esta linea
      # la variable del .env no llegaba al contenedor y siempre regia el valor por
      # omision del application.yml, de modo que subirla para una demostracion no tenia
      # ningun efecto.
      NOTIFY_BACKOFF_LADDER: ${NOTIFY_BACKOFF_LADDER:-1000,2000,4000}
      # Por omision, el buzon de prueba del compose. Apuntar MAIL_PORT a un
      # puerto cerrado es lo que provoca el fallo transitorio de la
      # demostracion: cuatro intentos con backoff y despues la DLQ.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      # mailpit no pide autenticacion ni TLS; el application.yml los activa para
      # un servidor real, asi que aqui se desactivan.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"

      # Plazos del cliente SMTP. Sin ellos JavaMail espera de forma INDEFINIDA, y un
      # servidor de correo inalcanzable deja de ser un fallo transitorio: se convierte en
      # un hilo bloqueado que detiene q.cmd.email entera, sin reintentos, sin DLQ y sin un
      # solo error en el log. Se midio contra el entorno desplegado: el envio aguanto veinte
      # segundos bloqueado y acabo con exito al volver el servidor, confirmando en el primer
      # intento un mensaje que debia haber recorrido los cuatro.
      #
      # Van tambien en el application.yml del servicio; aqui se repiten para poder ajustarlos
      # sin reconstruir la imagen, que es lo que permite demostrar el recorrido completo.
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "${MAIL_TIMEOUT_MS:-5000}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "${MAIL_TIMEOUT_MS:-5000}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "${MAIL_TIMEOUT_MS:-5000}"
      # Validan el JWT de /api/v1/notify/status y /actuator/metrics, que exigen el rol Admin.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-055d11d1-8ae0-4221-a6f7-b50be0a623b4}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-704a544f-3d92-44f5-aef9-8559574cff34}
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    networks:
      - andesstay-mq
    # No publica el 8085. GET /api/v1/notify/status y /actuator/metrics existen para la evidencia y
    # exigen un JWT con el rol Admin; aun así, su superficie HTTP solo debe ser alcanzable desde
    # dentro de la instancia. /actuator/health queda abierto para el healthcheck de abajo.
    mem_limit: 384m
    healthcheck:
      # Aquí el health indicator de RabbitMQ sí está habilitado: si notify no alcanza el
      # broker, no sirve para nada y el contenedor debe quedar unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # API REST de administración de la topología: crea y elimina colas, exchanges y bindings.
  #
  # Vive junto al broker y no en ec2-apps por dos razones. La primera es que consulta la API de
  # gestión del 15672, que se publica SOLO en loopback: compartiendo la red de Docker la alcanza
  # por el nombre del servicio sin abrir ese puerto a nadie. La segunda es que no lo usa la
  # aplicación, lo usa el operador, así que no tiene por qué estar donde está el tráfico.
  mq:
    build:
      context: ../../ms-andesstay-mq
    container_name: andesstay-mq
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: andesstay
      RABBITMQ_USER: ${RABBITMQ_USER}
      # Mismo mapeo que en notify: el .env usa RABBITMQ_PASSWORD y la aplicación lee
      # RABBITMQ_PASS.
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      # Las escrituras van por AMQP (5672) y los listados por la API de gestión (15672),
      # porque el protocolo AMQP no define ninguna operación de listado. Se alcanza por el
      # nombre del servicio dentro de la red de Docker.
      RABBITMQ_MGMT_URL: http://rabbitmq1:15672
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-055d11d1-8ae0-4221-a6f7-b50be0a623b4}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-704a544f-3d92-44f5-aef9-8559574cff34}
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - andesstay-mq
    ports:
      # Publicado SOLO en loopback, igual que la Management UI y por el mismo motivo: un puerto
      # publicado por Docker omite ufw, porque la regla entra por la cadena DOCKER-USER. Con el
      # bind a 127.0.0.1 la única vía es el túnel SSH:
      #   ssh -i ~/.ssh/andesstay-key.pem -L 8086:localhost:8086 ubuntu@<ip-de-ec2-mq>
      #
      # Este servicio SÍ valida el JWT y exige el rol Admin, al contrario que notify, así que el
      # loopback es una segunda capa y no la única. Tampoco se publica en el API Gateway: es una
      # herramienta de operación, no parte de la aplicación.
      - "127.0.0.1:8086:8086"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
