version: "3.9"

# RabbitMQ cluster - 2 nodos
# Puertos: AMQP 5672 (nodo1), 5673 (nodo2) | Management UI 15672 (nodo1)

networks:
  andesstay-mq:
    driver: bridge

volumes:
  rabbitmq1-data:
  rabbitmq2-data:

services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: andesstay-rabbitmq1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_VHOST: andesstay
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - andesstay-mq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: andesstay-rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_VHOST: andesstay
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - andesstay-mq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      sh -c "rabbitmq-server &
             sleep 15 &&
             rabbitmqctl stop_app &&
             rabbitmqctl join_cluster rabbit@rabbitmq1 &&
             rabbitmqctl start_app &&
             tail -f /dev/null"
