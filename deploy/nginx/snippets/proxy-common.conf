# ─────────────────────────────────────────────────────────────────────────────
# Cabeceras comunes de todos los proxy_pass hacia el BFF.
#
# Se monta en /etc/nginx/snippets/ y no en conf.d/, porque conf.d es el destino
# de las plantillas procesadas por envsubst y nginx.conf incluye todo lo que
# haya ahí con *.conf.
# ─────────────────────────────────────────────────────────────────────────────

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# El cliente siempre llega por HTTPS a API Gateway; el tramo interno es HTTP.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;

# El Bearer tiene que llegar intacto: el BFF y cada microservicio vuelven a
# validar firma, issuer, audience y vigencia contra el JWKS de Entra ID.
proxy_set_header Authorization     $http_authorization;
proxy_pass_request_headers on;

# La cabecera compartida no se reenvía: cumple su función en nginx y al BFF no
# le aporta nada.
proxy_set_header X-Gateway-Secret  "";

# Permite reutilizar conexiones del upstream con keepalive
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Los errores del BFF (401 y 403 en JSON) se devuelven tal cual al cliente, sin
# reemplazarlos por las páginas de error de nginx.
proxy_intercept_errors off;
