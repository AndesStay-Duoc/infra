# ─────────────────────────────────────────────────────────────────────────────
# AndesStay — configuración principal de nginx
#
# Los server blocks están en conf.d/andesstay.conf.template, que el entrypoint
# de la imagen procesa con envsubst al arrancar el contenedor.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # El origen real llega en X-Forwarded-For desde API Gateway, así que el
    # $remote_addr de los logs siempre sería una IP de AWS.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" xff="$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # No revela la versión de nginx en las cabeceras ni en las páginas de error
    server_tokens   off;

    # El bloque "map" de andesstay.conf compara contra GATEWAY_SECRET, que son
    # 64 caracteres hexadecimales. El valor por defecto (64 bytes) no alcanza
    # para esa clave y nginx aborta con "could not build map_hash".
    map_hash_bucket_size  128;

    client_max_body_size  2m;
    client_body_timeout   15s;
    client_header_timeout 15s;

    # ── Compresión ───────────────────────────────────────────────────────────
    # Los bundles de Angular son el grueso de la transferencia. gzip_static no
    # se activa porque el builder no genera .gz.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
